name: Validate

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
